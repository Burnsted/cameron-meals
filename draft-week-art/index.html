<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f6e6e'/%3E%3Ccircle cx='16' cy='16' r='8' fill='none' stroke='%23fffaf4' stroke-width='2.5'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%23d9a441'/%3E%3C/svg%3E" />
<meta name="theme-color" content="#0b1220" id="theme-color-meta">
<script>(function(){try{var t=localStorage.getItem("cm-theme");if(t!=="light"&&t!=="dark")t="dark";document.documentElement.setAttribute("data-theme",t);document.documentElement.style.colorScheme=t;if(t==="light")document.documentElement.classList.add("theme-light");}catch(e){document.documentElement.setAttribute("data-theme","dark");}})();</script>
<title>My Meal Picker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0f172a;--card:#1e293b;--ink:#f1f5f9;--mut:#94a3b8;--chip:#334155;--on:#0ea5e9;--gold:#f59e0b}
  html[data-theme="light"]{--bg:#f4f7f6;--card:#fffaf4;--ink:#173042;--mut:#5b6b7a;--chip:#d5e3df;--on:#0f6e6e;--gold:#c47a2c}
  html[data-theme="light"] body{background:var(--bg);color:var(--ink)}
  html[data-theme="light"] .card,html[data-theme="light"] .welcome-card{background:var(--card);color:var(--ink)}
  html[data-theme="light"] .addrow input,html[data-theme="light"] .welcome-field,html[data-theme="light"] .ph-new-row input{background:#fff;color:var(--ink);border-color:rgba(15,110,110,.28)}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;justify-content:center}
  .wrap{width:100%;max-width:440px;padding:20px 16px 40px}
  .top{display:flex;justify-content:space-between;align-items:center;color:var(--mut);font-size:14px;margin-bottom:10px}
  .bar{height:6px;background:var(--chip);border-radius:6px;overflow:hidden;margin-bottom:18px}
  .bar i{display:block;height:100%;background:var(--on);transition:width .3s}
  .card{background:var(--card);border-radius:18px;padding:22px 18px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.3)}
  .emoji{font-size:64px;line-height:1;margin:4px 0 10px}
  h1{font-size:24px;margin:0 0 6px}
  p.sub{color:var(--mut);margin:0 0 18px}
  .chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:4px 0 20px}
  .chip{border:2px solid var(--on);background:var(--on);color:#fff;border-radius:999px;padding:10px 14px;font-size:16px;cursor:pointer;user-select:none}
  .chip.off{background:transparent;color:var(--ink);border-color:var(--chip)}
  .chip.drop.off{/* unselected — same look as .chip.off, not struck */}
  /* Gold/amber pills: dark text for WCAG AA (white-on-gold fails ~2:1) */
  .chip.main{background:var(--gold);border-color:var(--gold);color:#1a1a1a}
  .chip.open{outline:3px solid var(--gold);outline-offset:2px}
  .chip.addc{background:transparent;border:2px dashed var(--mut);color:var(--mut)}
  .chip.cust:not(.off){background:#8b5cf6;border-color:#8b5cf6}
  .next{width:100%;border:0;border-radius:14px;padding:16px;font-size:18px;font-weight:700;background:var(--on);color:#fff;cursor:pointer}
  .next:disabled{opacity:.4}
  .ghost{background:transparent;color:var(--mut);font-weight:500;font-size:15px;margin-top:8px;padding:10px}
  .addrow{display:flex;gap:8px;margin:0 0 18px}
  .addrow input{flex:1;min-width:0;border-radius:12px;border:2px solid var(--chip);background:#0b1222;color:var(--ink);padding:12px;font-size:16px}
  .addrow button{border:0;border-radius:12px;background:var(--chip);color:#fff;padding:0 16px;font-size:16px;cursor:pointer}
  .addrow.cust input{border-color:#8b5cf6}.addrow.cust button{background:#8b5cf6}
  .photos{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:0 0 18px}
  .ph{position:relative;aspect-ratio:3/4;border:2px dashed var(--chip);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;font-size:14px;color:var(--mut)}
  .ph span.big{font-size:34px;margin-bottom:6px}
  .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .ph.done{border:2px solid var(--on)}
  .ph .ok{position:absolute;bottom:6px;left:6px;right:6px;background:rgba(14,165,233,.9);color:#fff;border-radius:8px;padding:3px;font-size:12px}
  .ph input{display:none}
  .photos{grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}
  .ph-sec{position:relative;border:2px dashed var(--chip);border-radius:14px;padding:10px 32px 8px 8px;display:flex;flex-direction:column;gap:6px;min-height:140px;text-align:center}
  .ph-sec.done{border-color:var(--on)}
  .ph-sec-lab{font-size:13px;font-weight:800;color:var(--ink);line-height:1.2;padding-right:4px;word-break:break-word}
  .ph-sec-lab .big{display:block;font-size:28px;margin-bottom:2px}
  .ph-thumbs{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;align-items:center}
  .ph-thumb{position:relative;width:56px;height:56px;border-radius:8px;overflow:hidden;border:2px solid var(--chip);flex-shrink:0}
  .ph-thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .ph-thumb .ph-x{position:absolute;top:0;right:0;width:28px;height:28px;border:0;border-radius:0;background:transparent;box-shadow:none;color:#000;display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer;line-height:0}
  .ph-thumb .ph-x .ico{width:14px;height:14px;stroke:#000}
  .ph-add{appearance:none;border:2px solid var(--chip,#334155);background:var(--card,#1e293b);color:var(--ink,#f1f5f9);width:36px;height:36px;min-height:36px;min-width:36px;border-radius:50%;padding:0;margin:0;font:inherit;text-decoration:none;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:none;gap:0}
  .ph-add .ico{width:18px;height:18px;stroke:currentColor;display:block}
  .ph-add-sec{appearance:none;border:2px dashed var(--chip);border-radius:14px;background:transparent;color:var(--mut);min-height:140px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;font:inherit;font-weight:800;font-size:13px}
  .ph-add-sec .ico{width:22px;height:22px;stroke:currentColor}
  .ph-sec-del{appearance:none;position:absolute;top:4px;right:4px;width:24px;height:24px;border:0;border-radius:50%;background:rgba(15,23,42,.7);color:#fff;display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer}
  .ph-sec-del .ico{width:12px;height:12px;stroke:#fff}
  .ph-new-row{display:flex;gap:8px;margin:0 0 12px;align-items:center}
  .ph-new-row input{flex:1;min-height:44px;border-radius:12px;border:2px solid var(--chip);background:#0b1222;color:var(--ink);padding:10px;font:inherit;font-weight:700}
  .sum{text-align:left}
  .sum h2{font-size:17px;margin:16px 0 6px}
  .sum p{margin:0}
  .tag{display:inline-block;background:var(--chip);border-radius:999px;padding:4px 10px;margin:3px;font-size:14px}
  .tag.y{background:#065f46}
  .no{color:var(--mut);font-size:14px}
  .muted{color:var(--mut);font-size:13px;margin-top:16px}
  /* variant pop list */
  .pop{background:#0b1222;border:2px solid var(--gold);border-radius:16px;padding:12px;margin:-8px 0 18px;text-align:left;animation:pop .15s ease}
  .pop .ph2{font-size:14px;color:var(--gold);font-weight:700;margin:0 0 8px}
  .pop .opts{display:flex;flex-wrap:wrap;gap:8px}
  .popt{border:2px solid var(--chip);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 12px;font-size:15px;cursor:pointer}
  .popt.sel{background:var(--on);border-color:var(--on);color:#fff}
  .popt.rm{border-color:#7f1d1d;color:#fca5a5}
  @keyframes pop{from{opacity:0;transform:translateY(-4px)}to{opacity:1}}
  /* equipment */
  .feat{display:flex;align-items:center;gap:12px;text-align:left;border:3px solid var(--chip);border-radius:18px;padding:14px;margin:0 0 8px;cursor:pointer;background:#0b1222}
  .feat.on{border-color:var(--gold);background:linear-gradient(135deg,#3b2a06,#1e293b)}
  .feat .fe{font-size:40px}
  .feat b{font-size:18px}
  .feat .dad{color:var(--gold);font-size:14px;margin-top:3px}
  .feat .ck{margin-left:auto;width:34px;height:34px;border-radius:50%;border:2px solid var(--chip);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
  .feat.on .ck{background:var(--gold);border-color:var(--gold);color:#111}
  .fnote{font-size:13px;color:var(--mut);margin:0 0 16px}
  .lbl{font-size:13px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em;margin:6px 0 8px}
  /* meals yes/no */
  .meals{display:flex;flex-direction:column;gap:10px;margin:0 0 16px;text-align:left}
  .meal{background:#0b1222;border:2px solid var(--chip);border-radius:16px;padding:10px 12px}
  .meal.yes{border-color:#10b981}.meal.no{opacity:.55}
  .mrow{display:flex;align-items:center;gap:10px}
  .me{font-size:34px;line-height:1}
  .mt{flex:1;min-width:0}
  .mt b{font-size:16px;word-break:normal;overflow-wrap:break-word;hyphens:none}
  .vchip{display:inline-block;margin-top:4px;border:2px solid var(--gold);color:var(--gold);border-radius:999px;padding:3px 10px;font-size:13px;cursor:pointer}
  .fb{display:inline-block;margin-top:4px;font-size:12px;color:#fbbf24}
  .yn{display:flex;gap:6px}
  .yn button{border:2px solid var(--chip);background:transparent;color:var(--ink);border-radius:12px;padding:10px 12px;font-size:15px;font-weight:700;cursor:pointer}
  .yn button.y.sel{background:#10b981;border-color:#10b981}
  .yn button.n.sel{background:#7f1d1d;border-color:#7f1d1d}
  .tipbtn{display:block;width:100%;margin-top:8px;border:0;background:transparent;color:var(--on);text-align:left;font-size:14px;padding:4px 0;cursor:pointer}
  .tip{margin-top:6px;background:var(--card);border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.4}
  .tip ol{margin:6px 0;padding-left:20px}
  .tip .t1{color:#fbbf24;font-weight:700}
  .tip .t2{color:#f87171;font-weight:700}
  .tip .t3{color:var(--mut);font-size:12px}
  details.box{background:#0b1222;border:2px solid var(--chip);border-radius:14px;padding:10px 12px;margin:0 0 16px;text-align:left}
  details.box summary{cursor:pointer;font-weight:700}
  details.box ul{margin:8px 0 0;padding-left:20px;font-size:14px;line-height:1.45}
  /* Yellow CTA: dark text on amber fill (matches .rcpt-btn contrast) */
  .build,.next.build{background:linear-gradient(135deg,#f59e0b,#d97706);color:#1a1a1a;font-size:22px;padding:20px;margin-top:18px;box-shadow:0 6px 0 rgba(146,64,14,.6)}
  /* ===== week planner: view state ≠ theme ===== */
  #week{display:none;width:100%;max-width:460px;padding:14px 14px 50px}
  body.view-week #week{display:block}
  body.view-week .wrap{display:none}
  /* Dark week tokens (default when data-theme=dark) */
  body.view-week{--wbg:#0f1a2a;--wink:#e8eef6;--wsoft:#9aa8b8;--teal:#2dd4bf;--tealD:#5eead4;--tealS:rgba(45,212,191,.18);--coral:#fb923c;--coralD:#fdba74;--coralS:rgba(251,146,60,.2);--wgold:#fbbf24;--white:#152033;
    background:radial-gradient(circle at 10% 0%,rgba(45,212,191,.12),transparent 38%),radial-gradient(circle at 95% 12%,rgba(251,146,60,.1),transparent 34%),linear-gradient(180deg,#0b1220 0%,#0f1a2a 50%,#121a28 100%);color:var(--wink);font-family:Nunito,Segoe UI,sans-serif}
  /* Light week tokens — unchanged from prior light week look */
  html[data-theme="light"] body.view-week{--wbg:#eef6f2;--wink:#173042;--wsoft:#3d5566;--teal:#0f6e6e;--tealD:#0a5555;--tealS:#d4efef;--coral:#d4572a;--coralD:#b9441c;--coralS:#ffe3d6;--wgold:#d9a441;--white:#fffaf4;
    background:radial-gradient(circle at 10% 0%,rgba(15,110,110,.16),transparent 38%),radial-gradient(circle at 95% 12%,rgba(212,87,42,.12),transparent 34%),linear-gradient(180deg,#f4faf7 0%,#eef6f2 42%,#f8f1e8 100%);color:var(--wink)}
  .wk-h{text-align:center;padding:4px 0 10px}
  .kick{margin:0;font-weight:800;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--tealD)}
  .brand{margin:2px 0 0;font-family:Fraunces,Georgia,serif;font-size:34px;font-weight:800;letter-spacing:-.03em;line-height:1.05}
  .wlabel{display:inline-block;margin:10px 0 4px;border:2px solid var(--teal);background:var(--white);color:var(--coralD);font-weight:800;border-radius:14px;padding:8px 18px;box-shadow:0 4px 0 rgba(15,110,110,.16)}
  .tagline{margin:6px auto 0;color:var(--wsoft);font-weight:700;font-size:14px}
  .pills{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:10px}
  .pill{font-weight:800;padding:7px 12px;border-radius:12px;font-size:14px}
  .pill.t{background:var(--tealS);color:var(--tealD)}.pill.c{background:var(--coralS);color:var(--coralD)}
  .rules{margin:6px 0 14px;padding:12px 14px;background:linear-gradient(135deg,#124f4f,var(--teal));color:#fff;border-radius:16px;box-shadow:0 8px 22px rgba(23,48,66,.12)}
  .rules h2{margin:0 0 6px;font-family:Fraunces,Georgia,serif;font-size:17px}
  .rules ul{margin:0;padding-left:18px;font-weight:650;font-size:13px;line-height:1.4}
  .rules li+li{margin-top:3px}
  .lt{background:var(--white);border:2px dashed rgba(212,87,42,.55);border-radius:16px;padding:10px 14px;margin:0 0 14px;box-shadow:0 8px 22px rgba(23,48,66,.12)}
  .lt summary{font-weight:800;color:var(--coralD);cursor:pointer;font-size:16px}
  .lt ul{margin:8px 0 0;padding-left:18px;font-weight:650;color:var(--wsoft);font-size:14px}
  .stitle{display:flex;align-items:baseline;justify-content:space-between;margin:14px 0 10px}
  .stitle h2{margin:0;font-family:Fraunces,Georgia,serif;font-size:22px}
  .stitle span{color:var(--wsoft);font-weight:700;font-size:13px}
  .day{background:var(--white);border-radius:16px;box-shadow:0 8px 22px rgba(23,48,66,.12);overflow:hidden;margin-bottom:12px;cursor:pointer;animation:pi .4s ease both}
  @keyframes pi{from{opacity:0;transform:scale(.97) translateY(8px)}to{opacity:1}}
  .dh{display:flex;justify-content:space-between;align-items:center;background:linear-gradient(135deg,var(--teal),var(--tealD));color:#fff;padding:9px 14px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;font-size:14px}
  .day.cook .dh{background:linear-gradient(135deg,var(--coral),var(--coralD))}
  .db{padding:12px 14px 14px}
  .memo{font-size:36px;line-height:1;display:block;margin-bottom:4px}
  .dinner{margin:0;font-size:18px;font-weight:800}
  .dnote{margin:7px 0 0;padding:7px 10px;background:var(--coralS);border-radius:10px;color:var(--coralD);font-weight:800;font-size:14px}
  .day:not(.cook) .dnote{background:var(--tealS);color:var(--tealD)}
  .dl{margin:7px 0 0;font-weight:700;font-size:14px;color:var(--wink)}
  .dl.b{color:var(--wsoft);font-weight:650}
  .hint{margin:7px 0 0;color:var(--wsoft);font-size:12px;font-weight:700}
  .rec{margin-top:10px;padding:10px 12px;background:var(--wbg);border-left:5px solid var(--teal);border-radius:12px;font-size:14px;font-weight:650;color:var(--wsoft)}
  .rec h4{margin:0 0 4px;color:var(--tealD);font-size:13px;text-transform:uppercase;letter-spacing:.04em}
  .rec ol{margin:0;padding-left:18px}
  .rec .t1{color:#b45309;font-weight:800}.rec .t2{color:#b91c1c;font-weight:800}.rec .t3{color:var(--wsoft);font-size:12px}
  .gpanel{background:var(--white);border-radius:20px;box-shadow:0 8px 22px rgba(23,48,66,.12);padding:14px;margin-bottom:16px}
  .tot{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:8px}
  .tot div{background:var(--wbg);border-radius:12px;padding:8px 6px;text-align:center;font-weight:800;font-size:13px;color:var(--wsoft)}
  .tot b{display:block;font-size:19px;color:var(--wink)}
  .tot .best{background:var(--tealS);color:var(--tealD)}
  .tot .main{outline:2px solid var(--wgold)}
  .gnote{font-size:13px;font-weight:700;color:var(--wsoft);background:var(--coralS);border-radius:12px;padding:8px 10px;margin:0 0 6px}
  .aisle{margin:14px 0 4px;padding-bottom:3px;border-bottom:2px solid #dceee6;color:var(--tealD);font-size:16px;display:flex;justify-content:space-between}
  .aisle small{color:var(--wsoft);font-size:12px}
  .it{display:grid;grid-template-columns:30px 1fr auto;gap:8px;align-items:center;padding:9px 2px;border-bottom:1px dashed rgba(23,48,66,.12)}
  .it .cb{width:26px;height:26px;border-radius:8px;border:2px solid var(--teal);display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff;cursor:pointer}
  .it.ck .cb{background:var(--teal)}
  .it.ck .nm{text-decoration:line-through;opacity:.6}
  .nm{font-weight:800;font-size:15px;cursor:pointer}
  .nm small{display:block;font-weight:650;color:var(--wsoft);font-size:12px}
  .nm .src{color:var(--teal)}
  .pr{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px;font-size:12px;font-weight:800}
  .pr span{white-space:nowrap}
  .pr span{padding:2px 6px;border-radius:8px;background:var(--wbg);color:var(--wsoft)}
  .pr span.win{background:#d1fae5;color:#065f46}
  .have{border:2px solid rgba(23,48,66,.15);background:#fff;border-radius:10px;padding:7px 8px;font-weight:800;font-size:12px;color:var(--wsoft);cursor:pointer;white-space:nowrap}
  .gone{opacity:.45}
  .gone .have{background:var(--wgold,#fbbf24);color:#1a1a1a}
  .gone .nm{text-decoration:line-through}
  .gh{display:none!important} /* Steve: hide repo/dev card from Cameron view */
  .gh b{font-size:16px}.gh span{display:block;font-size:13px;opacity:.85;margin-top:3px;font-weight:650}
  .wbtn{display:block;width:100%;border:0;border-radius:14px;min-height:52px;font:inherit;font-weight:800;font-size:16px;cursor:pointer;margin-top:10px}
  .wbtn.p{background:linear-gradient(160deg,var(--teal),var(--tealD));color:#fff}
  .wbtn.g{background:var(--white);color:var(--wink);border:2px solid rgba(23,48,66,.12)}
  .foot{text-align:center;color:var(--wsoft);font-weight:650;font-size:12px;margin-top:16px;line-height:1.5}
  .foot a{color:var(--teal)}

  /* ===== v3: receipt button, calendar, budget, week customizer, build extras, prep badges ===== */
  .rcpt-btn{border:0;border-radius:999px;background:linear-gradient(135deg,#f59e0b,#d97706);color:#111;font:inherit;font-weight:800;font-size:15px;padding:10px 16px;min-height:44px;cursor:pointer;box-shadow:0 4px 0 rgba(146,64,14,.45)}
  .rcpt-top{display:flex;justify-content:center;align-items:center;gap:8px;margin:0 0 12px;flex-wrap:wrap}
  html[data-theme="light"] body.view-week .rcpt-btn{background:linear-gradient(135deg,var(--coral),var(--coralD));color:#fff;box-shadow:0 4px 0 rgba(185,68,28,.3)}
  .wl-row{display:flex;align-items:center;justify-content:center;gap:8px;margin:10px 0 4px}
  .wl-row .wlabel{margin:0}
  .cal-btn{width:48px;height:48px;border-radius:14px;border:2px solid var(--teal);background:var(--white);font-size:22px;cursor:pointer;box-shadow:0 4px 0 rgba(15,110,110,.16);flex-shrink:0}
  .pill.btn{border:0;font:inherit;font-weight:800;cursor:pointer;min-height:40px}
  .pill.bud{background:#fff;color:var(--tealD);border:2px solid rgba(15,110,110,.35)}
  .pill.bud.off{background:#eef1f3;color:#7a8a96;border-color:#d5dde2;font-weight:700}
  .bcmp{margin:8px auto 0;max-width:380px;border-radius:12px;padding:8px 12px;font-weight:800;font-size:14px}
  .bcmp.under{background:#d1fae5;color:#065f46}.bcmp.over{background:#fee2e2;color:#991b1b}
  .sheet-bg{position:fixed;inset:0;background:rgba(23,48,66,.55);display:none;align-items:flex-end;justify-content:center;z-index:60;padding:10px}
  .sheet-bg.open{display:flex}

function sideSlug(n){
  if(SIDE_SLUG[n])return SIDE_SLUG[n];
  return String(n||"").toLowerCase().replace(/&/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
}
function sideEmoji(n){return SIDE_EMOJI[n]||"🍽️"}

function sideTileHTML(n, opts={}){
  const on=!!opts.on, capped=!!opts.disabled, day=opts.day, dataAttr=opts.dataAttr||"data-addside";
  const emo=sideEmoji(n);
  const dayAttr=day!=null?` data-day="${day}"` : "";
  const label=typeof cleanCopy==="function"?cleanCopy(n):n;
  return `<button type="button" class="side-tile${on?" is-on":""}" ${dataAttr}="${esc(n)}"${dayAttr} aria-pressed="${on}" ${capped?"disabled":""}>

function sidesGridHTML(names, activeSet, dayIdx){

    return sideTileHTML(n,{on,disabled:capped,day:dayIdx,dataAttr:dayIdx!=null?"data-addside":"data-x"});
  }).join("")}</div>`;

/* ---- Custom meals (full cards, persisted) ---- */
const CUS_KEY="cameron-meals-custom-v1";
function loadCustomMeals(){
  try{const j=JSON.parse(localStorage.getItem(CUS_KEY)||"[]");return Array.isArray(j)?j.filter(m=>m&&m.id&&m.name):[]}catch(_){return []}
}
function saveCustomMeals(){try{localStorage.setItem(CUS_KEY,JSON.stringify(CUSTOM_MEALS))}catch(_){}}
let CUSTOM_MEALS=loadCustomMeals();
function buildMealFromName(name){
  const q=String(name||"").trim(); if(!q)return null;
  const ql=q.toLowerCase();
  const pool=[...MEALS,...MORE_MEALS,...CUSTOM_MEALS,...EXTRA_MEALS];
  const hit=pool.find(m=>m.name&&m.name.toLowerCase()===ql)||pool.find(m=>m.name&&m.name.toLowerCase().includes(ql));
  const id="c_"+sideSlug(q).slice(0,28)+"_"+Date.now().toString(36).slice(-4);
  if(hit){
    return {id,name:q,emoji:hit.emoji||"🍽️",tag:hit.tag||(hit.bf?"Breakfast":hit.grab?"Lunch":"Dinner"),
      prep:hit.prep||10,cook:hit.cook||8,nut:hit.nut?{...hit.nut}:null,grill:!!hit.grill,bf:!!hit.bf,bfKey:hit.bfKey,
      grab:!!hit.grab,time:hit.time||"10 to 15 min",temp:hit.temp||"cook to safe temp",
      grill:hit.grill?hit.grill.slice():["Cook on Foreman or skillet until done."],
      stove:hit.stove?hit.stove.slice():["Cook in a skillet until done."],custom:true,fromId:hit.id};
  }
  const tag=/oat|bagel|egg|breakfast|yogurt|scramble|omelette|toast/i.test(q)?"Breakfast":/salad|sandwich|wrap|melt|taco|lunch/i.test(q)?"Lunch":"Dinner";
  return {id,name:q,emoji:tag==="Breakfast"?"🍳":tag==="Lunch"?"🥪":"🍽️",tag,prep:8,cook:8,nut:null,grill:true,custom:true,
    time:"10 to 15 min",temp:"165°F poultry · 160°F ground · 145°F steak or pork + rest",
    grill:["Season. Cook on your Foreman or skillet to a safe temp.","Rest a few minutes; plate with a side."],
    stove:["Cook in a skillet until done."]};
}
function addCustomMealCard(name){
  const m=buildMealFromName(name); if(!m)return null;
  if(CUSTOM_MEALS.some(x=>x.name.toLowerCase()===m.name.toLowerCase())){
    const ex=CUSTOM_MEALS.find(x=>x.name.toLowerCase()===m.name.toLowerCase());
    st.meals[ex.id]="yes"; return ex;
  }
  CUSTOM_MEALS.push(m); saveCustomMeals(); st.meals[m.id]="yes"; return m;
}
function deleteCustomMeal(id){
  CUSTOM_MEALS=CUSTOM_MEALS.filter(m=>m.id!==id); saveCustomMeals();
  delete st.meals[id];
  try{const all=getRates();delete all[id];localStorage.setItem(RKEY,JSON.stringify(all))}catch(_){}
}

const allMeals=()=>[...MEALS,...(typeof MORE_MEALS!=="undefined"?MORE_MEALS:[]),...EXTRA_MEALS,...CUSTOM_MEALS];
const M=id=>{const a=allMeals();const hit=a.find(m=>m.id===id);if(hit)return hit;return (typeof MORE_MEALS!=="undefined"?MORE_MEALS:[]).find(m=>m.id===id)};
const WELCOME_KEY="cameron-meals-welcome-done-v1";
/* ---- Name / titles ---- */
function aboutNameRaw(){const a=(st&&st.about)||getAbout();return a&&Object.prototype.hasOwnProperty.call(a,"name")?String(a.name||"").trim():null}
function displayName(){
  const n=aboutNameRaw();
  // Untitled users get a neutral title (My Meal Picker), not a personal name
  if(n===null){
    if(st&&st._fromTemplate)return "";
    return "";
  }
  return n;
}
function possessive(n){if(!n)return "My";return /s$/i.test(n)?n+"'":n+"'s"}
function titlePicker(){const n=displayName();return n?possessive(n)+" Meal Picker":"My Meal Picker"}
function titleWeek(){const n=displayName();return n?possessive(n)+" Grill Week":"My Grill Week"}
function titleHQ(){const n=displayName();return n?"Kitchen HQ · "+n:"Kitchen HQ"}
function refreshTitles(){
  document.title=titlePicker();
  const t=$("appTitle"); if(t)t.textContent=titlePicker();
}
function getCamTheme(){try{const t=localStorage.getItem("cm-theme");return t==="light"||t==="dark"?t:"dark"}catch(_){return"dark"}}
function applyCamTheme(theme){
  theme=theme==="light"?"light":"dark";
  try{localStorage.setItem("cm-theme",theme)}catch(_){}
  document.documentElement.setAttribute("data-theme",theme);
  document.documentElement.style.colorScheme=theme;
  document.documentElement.classList.toggle("theme-light",theme==="light");
  const meta=$("theme-color-meta"); if(meta)meta.content=theme==="light"?"#f4f7f6":"#0b1220";
}
function toggleCamTheme(){applyCamTheme(getCamTheme()==="dark"?"light":"dark")}
const CM_VIEW_KEY="cm-view-week-v1";

function coffeeToJSON(c){
  if(!c||typeof c!=="object")return null;
  const arr=v=>{
    if(v instanceof Set)return [...v];
    if(Array.isArray(v))return v.filter(Boolean);
    return [];
  };
  return {brand:c.brand||"",brandOther:c.brandOther||"",machines:arr(c.machines),drinks:arr(c.drinks),milk:c.milk||"No milk",perWeek:c.perWeek||7};
}
function normalizeCoffee(c){
  const defMachines=["lavazza","nespresso"], defDrinks=["shot","americano"];
  const toSet=(v,fallback)=>{
    if(v instanceof Set){const a=[...v].filter(Boolean);return new Set(a.length?a:fallback)}
    if(Array.isArray(v)){const a=v.filter(Boolean);return new Set(a.length?a:fallback)}
    // JSON turned Set into {} — rebuild from defaults so drinks.has works
    return new Set(fallback);
  };
  if(!c||typeof c!=="object")return {brand:"Lavazza Qualità Oro",brandOther:"",machines:new Set(defMachines),drinks:new Set(defDrinks),milk:"No milk",perWeek:7};
  const machines=toSet(c.machines, defMachines.slice());
  if(typeof st!=="undefined"&&st&&st.equip){["lavazza","nespresso"].forEach(id=>{if(st.equip.has(id))machines.add(id)})}
  return {
    brand:c.brand||"Lavazza Qualità Oro",
    brandOther:c.brandOther||"",
    machines,
    drinks:toSet(c.drinks,defDrinks),
    milk:c.milk||"No milk",
    perWeek:Number(c.perWeek)>0?Number(c.perWeek):7
  };
}
const CM_WEEK_SNAP="cm-week-snap-v1"; /* legacy session key — migrated into draft */
const CM_DRAFT_KEY="cm-week-draft-v1"; /* mid-flow autosave (localStorage). Lock-in is separate. */
function isWeekView(){return document.body.classList.contains("view-week")}

function stToJSON(){
  if(!st)return null;
  const picks={};
  Object.keys(st.picks||{}).forEach(k=>{const v=st.picks[k];picks[k]=v instanceof Set?[...v]:(Array.isArray(v)?v.slice():[])});
  return {
    stores:[...(st.stores||[])],
    extra:(st.extra||[]).slice(),
    storeLoc:st.storeLoc||{},
    main:st.main||"",
    photos:st.photos||{},
    equip:[...(st.equip||[])],
    coffee:typeof coffeeToJSON==="function"?coffeeToJSON(st.coffee):st.coffee,
    drinks:st.drinks||{},
    meals:st.meals||{},
    mealV:st.mealV||{},
    mealVs:st.mealVs||{},
    pattyVs:(st.pattyVs||[]).slice(),
    tip:null,
    build:st.build||null,
    weekStart:st.weekStart||null,
    about:st.about||null,
    aboutReturn:!!st.aboutReturn,
    sides:[...(st.sides||[])],
    picks,
    custom:st.custom||{},
    mealCustom:(st.mealCustom||[]).slice(),
    sidePick:st.sidePick||null,
    pickBackup:st.pickBackup||null,
    _fromTemplate:!!st._fromTemplate
  };
}
function applyStJSON(j){
  if(!j||!st)return;
  if(j.stores)st.stores=new Set(j.stores);
  if(j.extra)st.extra=j.extra.slice();
  if(j.storeLoc)st.storeLoc=j.storeLoc;
  if(j.main!=null)st.main=j.main;
  if(j.photos)st.photos=j.photos;
  if(j.equip)st.equip=new Set(j.equip);
  if(j.coffee)st.coffee=normalizeCoffee(j.coffee);
  if(j.drinks)st.drinks=j.drinks;
  if(j.meals)st.meals=j.meals;
  if(j.mealV)st.mealV=j.mealV;
  if(j.mealVs)st.mealVs=j.mealVs;
  if(j.pattyVs)st.pattyVs=j.pattyVs.slice();
  if(j.build)st.build=j.build;
  if(j.weekStart!=null)st.weekStart=j.weekStart;
  if(j.about)st.about=j.about;
  st.aboutReturn=!!j.aboutReturn;
  if(j.sides)st.sides=new Set(j.sides);
  st.picks={}; Object.keys(j.picks||{}).forEach(k=>st.picks[k]=new Set(j.picks[k]||[]));
  if(j.custom)st.custom=j.custom;
  if(j.mealCustom)st.mealCustom=j.mealCustom.slice();
  st.sidePick=j.sidePick||null;
  st.pickBackup=j.pickBackup||null;
  st._fromTemplate=!!j._fromTemplate;
  st.open=null;st.cOpen=null;st.xOpen=null;st.tip=null;
}
function wToJSON(){
  if(!W)return null;
  return {
    base:W.base||[],
    ov:W.ov||{},
    groups:(W.groups||[]).slice(),
    extra:(W.extra||[]).slice(),
    F:W.F||null,
    have:[...(W.have||[])],
    ck:[...(W.ck||[])],
    daySides:W.daySides||{},
    gCat:W.gCat||null,
    gSearch:W.gSearch||"",
    stockOptIn:(W.stockOptIn||[]).slice(),
    munchiesOptIn:(W.munchiesOptIn||[]).slice(),
    sideOffers:W.sideOffers||{},
    dayMealOffers:W.dayMealOffers||{}
  };
}
function applyWJSON(j){
  if(!j||!j.base)return false;
  W={
    base:j.base,ov:j.ov||{},groups:j.groups||[],extra:j.extra||[],F:j.F||null,
    have:new Set(j.have||[]),ck:new Set(j.ck||[]),
    open:null,items:[],listFilter:null,shopHi:null,
    daySides:j.daySides||{},gSearch:j.gSearch||"",gCat:j.gCat||null,
    stockOptIn:j.stockOptIn||[],munchiesOptIn:j.munchiesOptIn||[],sideOffers:j.sideOffers||{},
    dayMealOffers:j.dayMealOffers||{}
  };
  try{recomputeList()}catch(_){}
  return true;
}
function queueStepId(){
  const s=queue&&queue[pos];
  if(s==null)return "home";
  if(typeof s==="object")return s.build?("build:"+s.build):(s.side?("side:"+s.side):JSON.stringify(s));
  return String(s);
}
function findQueuePos(stepId){
  if(!queue||!stepId)return 0;
  if(String(stepId).startsWith("build:")){
    const id=String(stepId).slice(6);
    const i=queue.findIndex(s=>s&&typeof s==="object"&&s.build===id);
    return i>=0?i:queue.indexOf("meals");
  }
  if(String(stepId).startsWith("side:")){
    const id=String(stepId).slice(5);
    const i=queue.findIndex(s=>s&&typeof s==="object"&&s.side===id);
    return i>=0?i:queue.indexOf("sides");
  }
  const i=queue.indexOf(stepId);
  return i>=0?i:0;
}
function draftView(){
  if(isWeekView())return "week";
  /* Prefer week if a built week package exists (survives accidental setup remount) */
  if(W&&W.base&&W.base.length)return "week";
  const s=queue&&queue[pos];
  if(s==="home")return "home";
  return "setup";
}
function persistDraft(force){
  /* Autosave mid-flow to localStorage after every meaningful change.
     Lock in (cm-week-lock-v1) is a separate committed mark — both coexist. */
  if(!st)return;
  try{
    const pack={
      v:1,
      savedAt:Date.now(),
      view:draftView(),
      pos:pos|0,
      step:queueStepId(),
      mealListOffset:typeof mealListOffset==="number"?mealListOffset:0,
      st:stToJSON(),
      W:wToJSON()
    };
    localStorage.setItem(CM_DRAFT_KEY,JSON.stringify(pack));
    /* Keep session mirror for same-tab Back/forward without wiping */
    if(W&&W.base){
      sessionStorage.setItem(CM_VIEW_KEY,isWeekView()?"1":"0");
      sessionStorage.setItem(CM_WEEK_SNAP,JSON.stringify({base:W.base,ov:W.ov,groups:W.groups,extra:W.extra,F:W.F,have:[...W.have],ck:[...W.ck],daySides:W.daySides||{},st:stToJSON()}));
    }
  }catch(_){}
}
function saveWeekSnap(){persistDraft(true)}
function clearWeekSnap(){
  /* LEGACY name — do NOT wipe mid-flow draft on route change.
     Only clear session view flag. Draft cleared only by explicit Start over. */
  try{sessionStorage.removeItem(CM_VIEW_KEY)}catch(_){}
}
function clearMidFlowDraft(){
  try{localStorage.removeItem(CM_DRAFT_KEY)}catch(_){}
  try{sessionStorage.removeItem(CM_VIEW_KEY);sessionStorage.removeItem(CM_WEEK_SNAP)}catch(_){}
}
function loadDraft(){
  try{
    const raw=localStorage.getItem(CM_DRAFT_KEY);
    if(raw){const j=JSON.parse(raw);if(j&&j.v===1&&j.st)return j}
  }catch(_){}
  /* Migrate legacy session snap once */
  try{
    const raw=sessionStorage.getItem(CM_WEEK_SNAP);
    if(!raw)return null;
    const j=JSON.parse(raw);
    if(!j)return null;
    return {v:1,savedAt:Date.now(),view:sessionStorage.getItem(CM_VIEW_KEY)==="1"?"week":"setup",pos:0,step:"home",mealListOffset:0,st:j.st||null,W:j.base?{base:j.base,ov:j.ov,groups:j.groups,extra:j.extra,F:j.F,have:j.have,ck:j.ck,daySides:j.daySides}:{}};
  }catch(_){return null}
}
function hasMidFlowDraft(){
  const d=loadDraft();
  if(!d||!d.st)return false;
  const meals=d.st.meals||{};
  if(Object.keys(meals).length)return true;
  if(d.W&&d.W.base&&d.W.base.length)return true;
  if((d.st.sides||[]).length)return true;
  if(d.view==="week"||d.view==="setup")return d.step&&d.step!=="home";
  return false;
}
function restoreDraft(){
  const j=loadDraft();
  if(!j||!j.st)return false;
  try{
    if(!st)reset();
    applyStJSON(j.st);
    if(typeof mealListOffset!=="undefined")mealListOffset=j.mealListOffset|0;
    /* Rebuild queue so MEALB/BUILD steps match restored meals/sides */
    queue=["home","photos","stores","about","equip","meals","MEALB","sides","BUILD","summary"];
    pos=0;
    try{
      const want=j.step||"home";
      for(let guard=0;guard<80;guard++){
        const s=queue[pos];
        if(s==="MEALB"){buildMealSteps();continue}
        if(s==="BUILD"){buildDrill();continue}
        if(queueStepId()===want)break;
        if(pos>=queue.length-1)break;
        pos++;
      }
      const p2=findQueuePos(j.step);
      if(p2>=0)pos=p2;
    }catch(_){pos=typeof j.pos==="number"?j.pos:0}

    /* CRITICAL: once a week package exists, refresh/back MUST restore the week board —
       never dump to meal-picker mid-progress. view flag is advisory only. */
    const hasWeek=!!(j.W&&j.W.base&&j.W.base.length);
    let lockPack=null;
    try{if(typeof getWeekLock==="function")lockPack=getWeekLock()}catch(_){}
    if(!hasWeek&&lockPack&&lockPack.base&&lockPack.base.length){
      j.W={base:lockPack.base,ov:lockPack.ov||{},groups:lockPack.groups||[],extra:lockPack.extra||[],F:lockPack.F||null,have:[],ck:[],daySides:lockPack.daySides||{},sideOffers:lockPack.sideOffers||{}};
    }
    if(j.W&&j.W.base&&j.W.base.length){
      applyWJSON(j.W);
      document.body.classList.add("view-week");
      document.body.classList.remove("light","view-home");
      applyCamTheme(getCamTheme());
      try{sessionStorage.setItem(CM_VIEW_KEY,"1")}catch(_){}
      /* Park setup queue on summary so Back shows picks, not meals step */
      try{
        const si=queue.indexOf("summary");
        if(si>=0)pos=si;
      }catch(_){}
      renderWeek();
      updateBackBtn();
      try{persistDraft(true)}catch(_){}
      return true;
    }
    /* Mid-setup only when no week has been built yet */
    document.body.classList.remove("view-week");
    if(j.view==="home"||queue[pos]==="home")document.body.classList.add("view-home");
    else document.body.classList.remove("view-home");
    applyCamTheme(getCamTheme());
    updateBackBtn();
    return true;
  }catch(e){console.warn("[cam draft] restore failed",e);return false}
}
function restoreWeekSnap(){
  /* Prefer durable localStorage draft; fall back to legacy session snap */
  if(restoreDraft())return isWeekView();
  return false;
}
function showWeekView(){
  document.body.classList.add("view-week");
  document.body.classList.remove("light","view-home");
  applyCamTheme(getCamTheme());
  persistDraft(true);
  updateBackBtn();
}
function hideWeekView(){
  /* CRITICAL FIX: do NOT wipe mid-flow draft on Back / route change.
     Only leave week view UI. Autosave keeps week + setup intact. */
  document.body.classList.remove("view-week");
  document.body.classList.remove("light");
  if(typeof teardownDayExpandIO==="function")teardownDayExpandIO();
  try{sessionStorage.setItem(CM_VIEW_KEY,"0")}catch(_){}
  persistDraft(true);
  updateBackBtn();
}

function foodCatalog(){
  const set=new Set(FOOD_WORDS);
  allMeals().forEach(m=>{if(m.name)set.add(m.name);(m.v||[]).forEach(v=>set.add(v))});
  allCatalogSides().forEach(n=>set.add(n));
  Object.values(C.PRICES||{}).forEach(p=>{if(p&&p.n)set.add(p.n)});
  SIDE_GROUPS.forEach(g=>g.items.forEach(it=>set.add(it.n)));
  return [...set];
}
function acSuggest(q,limit=8){
  q=String(q||"").trim().toLowerCase(); if(q.length<1)return [];
  const all=foodCatalog();
  const pref=[], sub=[];
  for(const w of all){
    const l=w.toLowerCase();
    if(l.startsWith(q))pref.push(w);
    else if(q.length>=2&&l.includes(q))sub.push(w);
    if(pref.length>=limit)break;
  }
  return [...pref,...sub].slice(0,limit);
}
function bindAutocomplete(input,onPick){
  if(!input||input._acBound)return; input._acBound=1;
  let wrap=input.closest(".ac-wrap");
  if(!wrap){wrap=document.createElement("div");wrap.className="ac-wrap";input.parentNode.insertBefore(wrap,input);wrap.appendChild(input)}
  let list=null, idx=-1;
  const close=()=>{if(list){list.remove();list=null}idx=-1};
  const pick=v=>{input.value=v;close();if(onPick)onPick(v);input.focus()};
  const draw=()=>{
    const items=acSuggest(input.value);
    close();
    if(!items.length||document.activeElement!==input)return;
    list=document.createElement("div");list.className="ac-list";list.setAttribute("role","listbox");
    items.forEach((t,i)=>{const b=document.createElement("button");b.type="button";b.textContent=t;b.setAttribute("role","option");
      b.onmousedown=e=>{e.preventDefault();pick(t)};list.appendChild(b)});
    wrap.appendChild(list);
  };
  input.addEventListener("input",draw);
  input.addEventListener("keydown",e=>{
    if(e.key==="Escape"){close();return}
    if(!list)return;
    const buttons=[...list.querySelectorAll("button")];
    if(e.key==="ArrowDown"){e.preventDefault();idx=Math.min(buttons.length-1,idx+1);buttons.forEach((b,i)=>b.setAttribute("aria-selected",i===idx?"true":"false"))}
    else if(e.key==="ArrowUp"){e.preventDefault();idx=Math.max(0,idx-1);buttons.forEach((b,i)=>b.setAttribute("aria-selected",i===idx?"true":"false"))}
    else if(e.key==="Enter"&&idx>=0&&buttons[idx]){e.preventDefault();pick(buttons[idx].textContent)}
  });
  input.addEventListener("blur",()=>setTimeout(close,150));
}
function wireAllAutocomplete(root){
  (root||document).querySelectorAll("input#cin, input#own, input#cbrand, input[data-sloc], .addrow input, .ab-grid input#abName").forEach(inp=>{
    if(inp.type==="number"||inp.type==="file")return;
    if(/age|weight|height|ft|inch|lb|budget|amt|days/i.test(inp.id||inp.placeholder||""))return;
    bindAutocomplete(inp);
  });
}

/* ---- Sides on day cards ---- */
function fixedSidesForMeal(id){
  if(!id)return [];
  const raw=SIDE_PAIRINGS[id]||[];
  return raw.filter(n=>allCatalogSides().includes(n)||SIDES.includes(n)||n);
}
function sideCountInWeek(name,exceptIdx){
  if(!W)return 0;
  const days=effDays(W.ov);
  let n=0;
  days.forEach((d,i)=>{
    if(i===exceptIdx||d.kind==="hol"||d.kind==="rm"||d.kind==="out"||d.kind==="ff")return;
    if(d.sideName===name)n++;
    (d.extraSides||[]).forEach(s=>{if(s===name)n++});
  });
  return n;
}
function dayActiveSides(d){
  const out=[];
  if(d.sideName)out.push(d.sideName);
  (d.extraSides||[]).forEach(s=>{if(!out.includes(s))out.push(s)});
  return out;
}
function likedSidesForDay(d,exclude){
  const ex=new Set(exclude||[]);
  const out=[], seen=new Set();
  const rates=getRates();
  Object.keys(rates).forEach(id=>{
    const r=rates[id]; if(!r||(r.r!==1&&r.r!==2))return;
    (Array.isArray(r.sides)?r.sides:[]).forEach(n=>{
      if(n&&!ex.has(n)&&!seen.has(n)){seen.add(n);out.push(n)}
    });
  });
  return out.slice(0,8);
}
/* ---- Ted soft-bar: per-side-slot Regenerate (Cameron) ---- */
const SIDE_OFFER_COUNT=2;
function sidesOfferPool(){
  /* Prefer user-picked sides; fall back to full catalog */
  const liked=typeof sidesPool==="function"?sidesPool():[];
  const all=typeof allSides==="function"?allSides():(typeof allCatalogSides==="function"?allCatalogSides():SIDES.slice());
  const out=[], seen=new Set();
  [...liked,...all].forEach(n=>{if(n&&!seen.has(n)){seen.add(n);out.push(n)}});
  return out;
}
function ensureSideOffers(dayIdx,d){
  if(!W)return [];
  W.sideOffers=W.sideOffers||{};
  const key=String(dayIdx);
  if(Array.isArray(W.sideOffers[key])&&W.sideOffers[key].length){
    return W.sideOffers[key].slice();
  }
  /* Seed slots: meal pairings + active side + pool fillers. Not locked selections. */
  const offers=[];
  const seen=new Set();
  const push=n=>{if(n&&!seen.has(n)){seen.add(n);offers.push(n)}};
  (fixedSidesForMeal(d&&d.meal)||[]).forEach(push);
  dayActiveSides(d||{}).forEach(push);
  likedSidesForDay(d||{},offers).forEach(push);
  const pool=sidesOfferPool();
  let i=0;
  while(offers.length<SIDE_OFFER_COUNT&&i<pool.length){push(pool[(dayIdx+i)%pool.length]);i++}
  while(offers.length<SIDE_OFFER_COUNT)offers.push(offers[0]||"Garden salad");
  W.sideOffers[key]=offers.slice(0,SIDE_OFFER_COUNT);
  return W.sideOffers[key].slice();
}
function pickReplacementSide(dayIdx, slotIdx){
  const key=String(dayIdx);
  const cur=(W.sideOffers&&W.sideOffers[key])?W.sideOffers[key].slice():[];
  const avoid=new Set(cur);
  const pool=sidesOfferPool().filter(n=>!avoid.has(n));
  const wide=pool.length?pool:sidesOfferPool().filter(n=>n!==cur[slotIdx]);
  if(!wide.length)return cur[slotIdx]||null;
  /* Prefer not repeating elsewhere this week when possible */
  const fresh=wide.filter(n=>sideCountInWeek(n,dayIdx)<2);
  const bag=fresh.length?fresh:wide;
  return bag[Math.floor(Math.random()*bag.length)];
}
function setDaySidesSelection(dayIdx, sideNameNew, extra){
  const src=effDays(W.ov)[dayIdx];
  if(W.ov[dayIdx]&&W.ov[dayIdx].t&&W.ov[dayIdx].t!=="side"){
    W.ov[dayIdx]={...W.ov[dayIdx],sideName:sideNameNew,extraSides:extra};
  }else if(W.ov[dayIdx]&&W.ov[dayIdx].t==="side"){
    W.ov[dayIdx]={...W.ov[dayIdx],sideName:sideNameNew,extraSides:extra};
  }else{
    W.base[dayIdx]={...W.base[dayIdx],sideName:sideNameNew,extraSides:extra};
  }
  if(src&&src.meal){
    const all=getRates();
    if(all[src.meal]&&(all[src.meal].r===1||all[src.meal].r===2)){
      const sides=dayActiveSides({sideName:sideNameNew,extraSides:extra});
      all[src.meal]={...all[src.meal],sides};
      try{localStorage.setItem(RKEY,JSON.stringify(all))}catch(_){}
    }
  }
  W.daySides=W.daySides||{};
  const xs=dayActiveSides({sideName:sideNameNew,extraSides:extra});
  if(xs.length)W.daySides[dayIdx]=xs;else delete W.daySides[dayIdx];
}
function regenerateSideSlot(dayIdx, slotIdx){
  if(!W||typeof isWeekLocked==="function"&&isWeekLocked()){toast("Unlock with Edit week first");return}
  const d=effDays(W.ov)[dayIdx]; if(!d)return;
  const offers=ensureSideOffers(dayIdx,d);
  if(slotIdx<0||slotIdx>=offers.length)return;
  const oldName=offers[slotIdx];
  const next=pickReplacementSide(dayIdx, slotIdx);
  if(!next||next===oldName){toast("No other sides in the pool right now");return}
  offers[slotIdx]=next;
  W.sideOffers=W.sideOffers||{};
  W.sideOffers[String(dayIdx)]=offers;
  /* If THIS slot was selected, move selection to the new option.
     Other locked-in selections stay. Never wipe unrelated picks. */
  const active=dayActiveSides(d);
  if(active.includes(oldName)){
    let sideNameNew=d.sideName, extra=[...(d.extraSides||[])];
    if(sideNameNew===oldName)sideNameNew=next;
    else{
      extra=extra.map(s=>s===oldName?next:s);
      if(!extra.includes(next)&&sideNameNew!==next){/* replaced in place */}
    }
    /* Dedup */
    extra=extra.filter(s=>s&&s!==sideNameNew);
    setDaySidesSelection(dayIdx, sideNameNew, extra);
  }
  try{persistDraft(true)}catch(_){}
  recomputeList();renderWeek();
  toast("New side: "+next);
}
function applySideToDay(dayIdx, sideName){
  if(!W||!sideName)return;
  if(typeof isWeekLocked==="function"&&isWeekLocked()){toast("Unlock with Edit week first");return}
  const src=effDays(W.ov)[dayIdx];
  const active=dayActiveSides(src);
  const on=active.includes(sideName);
  let sideNameNew=src.sideName, extra=[...(src.extraSides||[])];
  if(on){
    if(sideNameNew===sideName)sideNameNew=extra.shift()||null;
    else extra=extra.filter(s=>s!==sideName);
  }else{
    if(sideCountInWeek(sideName,dayIdx)>=2){toast("That side is already on twice this week");return}
    if(!sideNameNew)sideNameNew=sideName;
    else if(!extra.includes(sideName))extra.push(sideName);
  }
  setDaySidesSelection(dayIdx, sideNameNew, extra);
  try{persistDraft(true)}catch(_){}
  recomputeList();renderWeek();
  toast(on?"Removed "+sideName:"Added "+sideName);
}
function sideSlotHTML(n, dayIdx, slotIdx, on){
  const capped=!on&&sideCountInWeek(n,dayIdx)>=2;
  return `<div class="side-slot" data-sideslot="${dayIdx}:${slotIdx}">
    ${sideTileHTML(n,{on,disabled:capped,day:dayIdx,dataAttr:"data-addside"})}
    <button type="button" class="side-regen" data-regen-side="${dayIdx}" data-regen-slot="${slotIdx}" aria-label="Regenerate side option" ${typeof isWeekLocked==="function"&&isWeekLocked()?"disabled":""}>Regenerate</button>
  </div>`;
}
function sidesBlockHTML(d,i){
  if(d.kind==="hol"||d.kind==="rm"||d.kind==="out"||d.kind==="ff")return "";
  const offers=ensureSideOffers(i,d);
  const active=dayActiveSides(d);
  const actSet=new Set(active);
  /* Liked extras beyond current offers — still selectable, no regen (not slots) */
  const liked=likedSidesForDay(d,[...offers,...active]).filter(n=>!offers.includes(n)).slice(0,4);
  if(!offers.length&&!liked.length&&!active.length)return "";
  const locked=typeof isWeekLocked==="function"&&isWeekLocked();
  return `<div class="sides-block" onclick="event.stopPropagation()">
    <span class="sides-lbl">Sides</span>
    <div class="sides-slots">${offers.map((n,si)=>sideSlotHTML(n,i,si,actSet.has(n))).join("")}</div>
    ${liked.length?`<span class="sides-lbl">From meals you liked</span>${sidesGridHTML(liked,actSet,i)}`:""}
  </div>`;
}

function rotatePool(arr,seed,n){if(!arr.length)return [];const out=[];for(let i=0;i<n;i++)out.push(arr[(seed+i)%arr.length]);return out}

  if(id==="burger")return pattyAll();

function fixNextCut(id,used,pool){pool=pool||proteinCuts(id); if(!pool.length)return null;

function sidesPool(){return allSides().filter(s=>st.sides.has(s))}
function assignSides(mon,n){
  const pool=sidesPool(); const out=[], cnt={}; const seed=Math.floor(mon.getTime()/86400000);
  if(!pool.length){for(let i=0;i<n;i++)out.push("Caesar salad kit");return out}
  let pi=0;
  for(let d=0;d<n;d++){let picked=null,tries=0;
    while(tries<pool.length*2){const s=pool[(seed+d+pi+tries)%pool.length];cnt[s]=cnt[s]||0;
      if(cnt[s]<2){cnt[s]++;picked=s;break}tries++}
    if(!picked)picked=pool[(d+seed)%pool.length];
    out.push(picked);pi++}
  return out;
}

      st.main=ap[0];return st.main;

  if(selected.includes("Aldi")){st.main="Aldi";return"Aldi"}

/* ---- calories (USDA-based est., round to 10; Other → ?) ---- */
const PROTEIN_CAL=C.PROTEIN_CAL||{};
const round10=n=>n==null||!isFinite(n)?null:Math.round(n/10)*10;
const calTxt=n=>n==null?"cal: ?":`🔥 ${round10(n)} cal`;
function proteinCal(name){if(!name)return null;return PROTEIN_CAL[name]!=null?PROTEIN_CAL[name]:null}
function mealBaseCal(id,cut){const m=M(id);if(!m)return null;if(m.grab)return m.nut&&m.nut.kcal!=null?m.nut.kcal:null;
  if(id==="burger"){const p=cut||pattyAll()[0];const pc=proteinCal(p);return pc!=null?pc:(m.nut&&m.nut.kcal)}
  if(m.protein){const c=cut||mv(id);const pc=proteinCal(c);return pc!=null?pc:(m.nut&&m.nut.kcal)}
  return m.nut&&m.nut.kcal!=null?m.nut.kcal:null}
function buildExtrasCal(mid){
  const ADD={cheese:70,cheeseslice:70,bacon:60,avocado:80,bun:120,egg:70,mayo:50,bbq:30,sauce:30,butter:50,sour:50,shred:70,lettuce:5,tomato:10,onion:10,pickles:5,ketchup:15,mustard:10,hot:5,salsa:15,rice:210,wrap:140,tortilla:140,bread:80,op:40,gonion:30,mushroom:20,jal:5,jalapeno:5,avo:80,guac:80,beans:110,corn:70,broccoli:50,top:20,veg:60,blue:70,horse:10,relish:15,kraut:20,pick:5};
  const B=BUILDS[mid]; if(!B||!st.build[mid]) return {cal:0,unk:false};
  let cal=0, unk=false; const T=st.build[mid].top;
  [...B.core,...B.extras].forEach(t=>{if(!T[t.id]||!T[t.id].on)return;
    if(t.protein||t.id==="patty"||t.id==="meat"||t.id==="done"||t.id==="season"||t.id==="marinade"||t.id==="eggs")return;
    if(ADD[t.id]!=null)cal+=ADD[t.id]; else if(t.k&&ADD[t.k]!=null)cal+=ADD[t.k];});
  (st.build[mid].custom||[]).forEach(()=>{unk=true});
  return {cal,unk};
}
function sideCal(name){const m=sideMeta(name);if(m.custom&&m.kcal==null)return null;return m.kcal!=null?m.kcal:null}
function mealTotalCal(mid, cutOverride){
  const m=M(mid); if(!m)return {cal:null,unk:true,label:"This meal: cal: ?"};
  if(m.grab){const c=m.nut&&m.nut.kcal;return {cal:c,unk:false,label:c==null?"This meal: cal: ?":`This meal: ${round10(c)} cal`}}
  let base=mealBaseCal(mid, cutOverride), unk=false;
  if(base==null)unk=true;
  const ex=buildExtrasCal(mid); if(ex.unk)unk=true;
  if(base==null&&!ex.cal)return {cal:null,unk:true,label:"This meal: cal: ?"};
  const total=(base||0)+ex.cal;
  return {cal:total,unk,label:`This meal: ${round10(total)} cal${unk?" · some cal: ?":""}`};
}
function dayCalTotal(d){
  if(d.kind==="hol"||d.kind==="rm"||d.kind==="out"||d.kind==="ff")return null;
  let total=0, unk=false;
  if(d.meal){const t=mealTotalCal(d.meal, d.cut); if(t.cal==null)unk=true; else total+=t.cal; if(t.unk)unk=true}
  else unk=true;
  dayActiveSides(d).forEach(sn=>{const sc=sideCal(sn);if(sc==null)unk=true;else total+=sc});
  if(d.bf){if(d.bf.kcal==null)unk=true;else total+=d.bf.kcal}
  if(unk&&!total)return {cal:null,unk:true};
  return {cal:total,unk};
}
function dayCalHTML(d){
  const t=dayCalTotal(d); if(!t)return "";
  const g=guideFor(st.about||{});
  let line=t.cal==null?`🍽 Dinner cal: ?`:`🍽 Dinner ${round10(t.cal)} cal`;
  if(g&&t.cal!=null){const pct=Math.round(t.cal/g.mid*100);line+=` · ${pct}% of your ${g.lo.toLocaleString()} to ${g.hi.toLocaleString()} guide`}
  return `<p class="nut">${line}${t.unk?" · some cal: ?":""}</p>`;
}

function easterDate(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),
  h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),
  month=Math.floor((h+l-7*m+114)/31)-1,day=((h+l-7*m+114)%31)+1;return new Date(y,month,day)}
function nthWeekday(y,month,weekday,n){
  if(n>0){const d=new Date(y,month,1);let c=0;while(d.getMonth()===month){if(d.getDay()===weekday){c++;if(c===n)return new Date(d)}d.setDate(d.getDate()+1)}}
  else{const d=new Date(y,month+1,0);while(d.getMonth()===month){if(d.getDay()===weekday)return new Date(d);d.setDate(d.getDate()-1)}}
  return null}
function holidaysInWeek(mon){
  const y=mon.getFullYear(), list=[], add=(dt,id,name)=>{if(dt&&dt>=mon&&dt<addDays(mon,7))list.push({date:new Date(dt.getFullYear(),dt.getMonth(),dt.getDate()),id,name})};
  add(new Date(y,0,1),"nyd","New Year's Day"); add(new Date(y,6,4),"july4","July 4");
  add(new Date(y,11,24),"xmasEve","Christmas Eve"); add(new Date(y,11,25),"xmas","Christmas Day");
  add(nthWeekday(y,10,4,4),"thanks","Thanksgiving"); add(nthWeekday(y,4,1,-1),"mem","Memorial Day");
  add(nthWeekday(y,8,1,1),"labor","Labor Day"); add(easterDate(y),"easter","Easter");
  if(mon.getMonth()===11)add(new Date(y+1,0,1),"nyd","New Year's Day");
  return list;
}
function holidayOn(date){return holidaysInWeek(mondayOf(date)).find(h=>sameDay(h.date,date))||null}
function isHolidayOff(date){const h=holidayOn(date);if(!h)return null;return getHolCook()[h.id]?null:h}

function syncBreakfastFromMeals(){
  const set=getSettings(); let changed=false;
  allMeals().filter(m=>m.bf&&st.meals[m.id]==="yes"&&m.bfKey).forEach(m=>{
    if(set.bfWeekday==="oatmeal"||set.bfWeekday==="overnight"){set.bfWeekday="cereal";changed=true}
    // Treat Yes breakfast meals as available options; prefer first Yes bf as weekday if user picked one
  });
  const yesBf=allMeals().filter(m=>m.bf&&st.meals[m.id]==="yes"&&m.bfKey);
  if(yesBf.length){
    const keys=yesBf.map(m=>m.bfKey);
    if(!keys.includes(set.bfWeekday)){set.bfWeekday=keys[0];changed=true}
    if(keys.includes("bec")){set.bfWeekend="bec";changed=true}
    else if(keys.length>1&&!keys.includes(set.bfAlt)){set.bfAlt=keys.find(k=>k!==set.bfWeekday)||set.bfAlt;changed=true}
  }
  if(changed)setSettings(set);
}

/* Ted: Cameron meat-forward lead — never open on avocado toast / fancy eggs.
   Note: many meals overwrite grill:true with grill:[steps], so sort must not coerce those arrays. */
function isForemanFriendly(m){
  if(!m)return false;
  if(m.grill===true||m.foreman===true)return true;
  return Array.isArray(m.grill)&&m.grill.length>0;
}
function camMealLeadRank(m){
  const id=String(m.id||"");
  const nm=String(m.name||"").toLowerCase();
  const blob=id+" "+nm;
  if(/x_avocado_toast|avocado\s*toast/.test(blob))return 900;
  if(/x_omelette|x_pb_toast|bf_eggs_toast|eggs?\s*\+\s*toast|cheese omelette|peanut butter toast/.test(blob))return 800;
  const lead=["steak","burger","chicken","x_smash_burger","x_sirloin_plate","x_cheese_burger","brats","pork","x_steak_taco","x_chix_taco","bf_bec","gg_rotisserie","x_chix_bbq","steakq","chixq","x_brat_mustard","bowl"];
  const i=lead.indexOf(id);
  if(i>=0)return i;
  if(/steak|burger|bacon|rotisserie|taco|brat|pork|chicken|beef|sirloin|ribeye|smash|quesadilla|bec|philly/.test(blob))return 40;
  if(m.grab)return 55;
  if(m.bf)return 65;
  return 100;
}
function mealYesNoPool(){
  const fm=st.equip.has("foreman");
  /* Flat list — no breakfast/dinner/grab buckets. Pagination slices this; answers stay in st.meals. */
  return allMeals().filter(m=>rateOf(m.id)!==-1)
    .sort((a,b)=>
      camMealLeadRank(a)-camMealLeadRank(b)
      ||(rateOf(b.id)===2)-(rateOf(a.id)===2)
      ||(fm?(Number(isForemanFriendly(b))-Number(isForemanFriendly(a))):0)
      ||String(a.name||"").localeCompare(String(b.name||""))
    );
}
function appendMoreMeals(){
  const pool=mealYesNoPool();

    const shown=new Set(allMeals().map(m=>m.id));
    const more=MORE_MEALS.filter(m=>!shown.has(m.id)&&rateOf(m.id)!==-1);
    if(!more.length){toast("No more meals right now");return}
    EXTRA_MEALS.push(...more.slice(0,MEAL_PAGE_SIZE));

const SHUFFLE_PREV_KEY="cameron-meals-shuffle-prev-v1";
/* Week role plan: cook nights + at most one leftover + open ~every other week + exactly one fast food. */
function planWeekRoles(start,rnd){
  const dayDate=i=>{const d=new Date(start);d.setDate(d.getDate()+i);return d};
  const isHolIdx=i=>!!isHolidayOff(dayDate(i));
  const roles=Array(7).fill("cook");
  let leftDay=-1;
  if(rnd(21)>0.32){
    const leftCandidates=[2,3,4,5].filter(i=>!isHolIdx(i));
    if(leftCandidates.length){
      leftDay=leftCandidates[Math.floor(rnd(22)*leftCandidates.length)];
      roles[leftDay]="left";
    }
  }
  /* Open on odd week index so the current Oct 2026 week shows Open (about every other week). */
  const seed=Math.floor(start.getTime()/86400000);
  const weekIdx=Math.floor(seed/7);
  let openDay=-1;
  if(weekIdx%2===1){
    const openCands=roles.map((r,i)=>r==="cook"&&i<6&&!isHolIdx(i)?i:-1).filter(i=>i>=0);
    if(openCands.length){
      openDay=openCands[Math.floor(rnd(23)*openCands.length)];
      roles[openDay]="open";
    }
  }
  let ffDay=-1;
  {
    const cookLeft=roles.map((r,i)=>r==="cook"&&!isHolIdx(i)?i:-1).filter(i=>i>=0);
    let ffCands=cookLeft.filter(i=>i===4||i===5);
    if(!ffCands.length)ffCands=cookLeft.filter(i=>i<6);
    if(!ffCands.length)ffCands=cookLeft.slice();
    if(ffCands.length){
      ffDay=ffCands[Math.floor(rnd(24)*ffCands.length)];
      roles[ffDay]="ff";
    }
  }
  return {roles,leftDay,openDay,ffDay,weekIdx};
}
function shuffleWeek(){
  // Rebuild week roles (open / fast food / ≤1 leftover) then shuffle cook-night meals.
  if(!W){toast("Finish setup first");return}
  const start=weekStartDate();
  const seed=Math.floor(start.getTime()/86400000)^Math.floor(Math.random()*1e6);
  const rnd=n=>{const x=Math.sin((seed+1)*(n+1)*9301+49297)*233280;return x-Math.floor(x)};
  const {roles,leftDay}=planWeekRoles(start,rnd);
  const sideSlots=assignSides(start,7);
  const breakfasts=planBreakfast(start);
  const pool=allMeals().filter(m=>!m.bf&&!m.grab&&m.id!=="veg"&&rateOf(m.id)!==-1);
  const more=(typeof MORE_MEALS!=="undefined"?MORE_MEALS:[]).filter(m=>!m.bf&&!m.grab&&rateOf(m.id)!==-1&&!pool.find(p=>p.id===m.id));
  let candidates=[...pool.filter(m=>yes(m.id)||rateOf(m.id)===2),...pool,...more];
  const seen=new Set(); candidates=candidates.filter(m=>{if(seen.has(m.id))return false;seen.add(m.id);return true});
  let prev=[]; try{prev=JSON.parse(localStorage.getItem(SHUFFLE_PREV_KEY)||"[]")}catch(_){prev=[]}
  const prevSet=new Set(prev);
  let fresh=candidates.filter(m=>!prevSet.has(m.id));
  if(fresh.length<5)fresh=candidates.slice();
  for(let i=fresh.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[fresh[i],fresh[j]]=[fresh[j],fresh[i]]}
  const leftMealFor=(m)=>{
    const g=MG[m.id]||null;
    if(g==="chicken")return yes("chixq")?{id:"chixq",e:"🫓",t:"Chicken "+mv("chixq").toLowerCase()}:yes("bowl")?{id:"bowl",e:"🍚",t:mv("bowl")+" chicken rice bowl"}:{id:m.id,e:m.emoji,t:(m.name||"Dinner")+" leftovers"};
    if(g==="steak")return yes("steakq")?{id:"steakq",e:"🌮",t:"Steak quesadilla"}:yes("stkegg")?{id:"stkegg",e:"🍳",t:"Steak & eggs"}:{id:m.id,e:m.emoji,t:(m.name||"Steak")+" leftovers"};
    if(g==="burger")return {id:m.id,e:m.emoji||"🍔",t:"Burger round 2"};
    if(g==="pork")return {id:"bowl",e:"🍚",t:"BBQ pork rice bowl"};
    if(g==="brats")return {id:m.id,e:m.emoji||"🌭",t:(m.name||"Sausage")+" round 2"};
    return {id:m.id,e:m.emoji||"🍱",t:"Leftovers · "+(m.name||"last night")};
  };
  const cookSlots=roles.map((r,i)=>r==="cook"?i:-1).filter(i=>i>=0);
  const used=[]; let fi=0;
  const cookPick={};
  const dn=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
  const days=[];
  const mk=(i,o)=>{const d=new Date(start);d.setDate(d.getDate()+i);
    const hol=isHolidayOff(d);
    const icon=o.cook?"🔥":(o.kind==="left"?"🔁":(o.kind==="ff"?"🥡":(o.kind==="rm"?"🆓":"🍽")));
    days.push({short:`${dn[i]} ${d.getMonth()+1}/${d.getDate()}`,date:d.getTime(),icon,bf:breakfasts[i],...o,
      kind:hol?"hol":o.kind||null,hol:hol?hol.name:null})};
  cookSlots.forEach(i=>{
    let m=fresh[fi++];
    while(m&&used.includes(m.id))m=fresh[fi++];
    if(!m)m=candidates.find(x=>!used.includes(x.id));

function storePriceOf(it, store){

  if(!it)return null;

  if(store==="Aldi")return it.a!=null?it.a:null;

function weekGroceryEstimate(store){
  /* Sum priced items only (incl. customs with a/p from prices.json). Unpriced omitted + counted. Cents kept. */
  const items=(W&&W.items)||[];
  const customs=(typeof getCamCustom==="function"?getCamCustom():[])||[];
  const stock=(typeof getStandingStock==="function"?getStandingStock():[])||[];
  const munch=(typeof getStandingMunchies==="function"?getStandingMunchies():[])||[];
  const all=[];
  const seen=new Set();
  const push=it=>{if(!it||(typeof itemHaveSuppressed==="function"?itemHaveSuppressed(it.id):(W&&W.have&&W.have.has(it.id))))return;const id=it.id||it.n;if(seen.has(id))return;seen.add(id);all.push(it)};
  items.forEach(push);customs.forEach(push);stock.forEach(push);munch.forEach(push);
  let sum=0, priced=0, unpriced=0;
  all.forEach(it=>{
    const v=storePriceOf(it, store);

  return {sum, priced, unpriced, total:all.length, money:sum.toFixed(2)};

function mealArtKeyFromId(id, dinner){

function mealArtKey(d){
  /* Diversify: remake leftovers use their own meal photo (not cook-night burger ×3). */
  if(!d)return "plate";

    /* Remake nights get remake art; plain leftovers alternate leftover packs — never reuse cook burger. */
    const remake=mealArtKeyFromId(id, dinner);

function cleanCopy(s){

  return String(s||"")

    .replace(/(\d)\s*-\s*(\d)/g,"$1 to $2")
    .replace(/(\d)\s*\/\s*(\d)/g,"$1 or $2")

  if(/Freezer day/i.test(n)||/from the freezer/i.test(n))return "From the freezer";

  if(/Your swap/i.test(n))return "Your swap";

/* ---- Steve auto-expand soft bar: IO 50-60%, debounce 120ms, one open ---- */
let _dayExpandIO=null;
let _dayExpandTimer=null;
let _dayExpandManual=false; // suppress IO during tap / rebind / sheets
let _dayExpandBindLock=false; // prevent observe→renderWeek→observe loop
function teardownDayExpandIO(){
  if(_dayExpandIO){try{_dayExpandIO.disconnect()}catch(_){}_dayExpandIO=null}
  if(_dayExpandTimer){clearTimeout(_dayExpandTimer);_dayExpandTimer=null}
}
function canAutoExpandDays(){
  if(!W||!document.body.classList.contains("view-week"))return false;
  if(_dayExpandBindLock||_dayExpandManual)return false;
  if(typeof sheetOpen==="function"&&sheetOpen())return false;
  if(document.getElementById("welcome-overlay"))return false;
  return true;
}
function openDayFromScroll(i){
  if(!canAutoExpandDays())return;
  if(W.open===i)return; // already open — never re-render
  /* Do not flip-flop between neighboring cards (that froze Lock in).
     Only auto-open when nothing is open; switching stays tap/chip. */
  if(W.open!=null)return;
  const el=document.querySelector('#week .day[data-d="'+i+'"]');
  if(!el||el.classList.contains("hol"))return;
  W.open=i;
  _dayExpandManual=true;
  _dayExpandBindLock=true;
  try{renderWeek()}finally{
    /* Keep bind lock longer so observe() after render cannot re-enter */
    setTimeout(()=>{_dayExpandManual=false;_dayExpandBindLock=false},800);
  }
}
function bindDayExpandOnScroll(wk){
  teardownDayExpandIO();
  if(!wk||typeof IntersectionObserver!=="function")return;
  if(typeof sheetOpen==="function"&&sheetOpen())return;
  const cards=[...wk.querySelectorAll(".day[data-d]")].filter(el=>!el.classList.contains("hol"));
  if(!cards.length)return;
  cards.forEach(el=>{el.classList.toggle("is-open",W&&W.open===+el.dataset.d)});
  /* If a day is already open, skip IO entirely this paint — stops render storms */
  if(W&&W.open!=null)return;
  _dayExpandBindLock=true;
  _dayExpandIO=new IntersectionObserver((entries)=>{
    if(!canAutoExpandDays())return;
    if(W&&W.open!=null)return;
    const visible=entries.filter(e=>e.isIntersecting&&e.intersectionRatio>=0.5);
    if(!visible.length)return;
    visible.sort((a,b)=>{
      const mid=window.innerHeight/2;
      const ca=a.boundingClientRect.top+a.boundingClientRect.height/2;
      const cb=b.boundingClientRect.top+b.boundingClientRect.height/2;
      return Math.abs(ca-mid)-Math.abs(cb-mid);
    });
    const i=+visible[0].target.dataset.d;
    if(!isFinite(i))return;
    if(_dayExpandTimer)clearTimeout(_dayExpandTimer);
    _dayExpandTimer=setTimeout(()=>{
      _dayExpandTimer=null;
      openDayFromScroll(i);
    },120);
  },{root:null,threshold:[0.5,0.55,0.6,0.65]});
  cards.forEach(el=>_dayExpandIO.observe(el));
  setTimeout(()=>{_dayExpandBindLock=false},500);
}

/* ---- Steve Have it bar: timed suppress (local haveItUntil), same spirit as Burns ---- */
const CM_HAVE_UNTIL_KEY="cm-have-until-v1";
const CM_SHOW_HIDDEN_HAVE="cm-show-hidden-have-v1";
/* Duration defaults (days) until Steve issues a finer map. Scale by qty, cap 180d. */
const HAVE_DUR={
  produce:5, meat:5,
  bread:7, milk:7, eggs:7, dairy:7,
  snacks:14, deli:14, grab:14,
  condiments:45,
  foil:60, lids:60, spices:60, oils:60,
  bulk:90, pantry:90, coffee:90, frozen:30, other:14
};
function loadHaveUntil(){
  try{const j=JSON.parse(localStorage.getItem(CM_HAVE_UNTIL_KEY)||"{}");return j&&typeof j==="object"?j:{}}catch(_){return{}}
}
function saveHaveUntil(map){try{localStorage.setItem(CM_HAVE_UNTIL_KEY,JSON.stringify(map||{}))}catch(_){}}
function getShowHiddenHave(){try{return localStorage.getItem(CM_SHOW_HIDDEN_HAVE)==="1"}catch(_){return false}}
function setShowHiddenHave(on){try{localStorage.setItem(CM_SHOW_HIDDEN_HAVE,on?"1":"0")}catch(_){}}
function sweepHaveUntil(map){
  const now=Date.now(); let dirty=false;
  Object.keys(map||{}).forEach(id=>{if(!map[id]||map[id]<=now){delete map[id];dirty=true}});
  if(dirty)saveHaveUntil(map);
  return map;
}
function parseQtyFactor(q){
  /* Scale duration by rough quantity. 1x default; more qty lasts longer, max handled by cap. */
  const s=String(q||"").toLowerCase();
  let n=1;
  const m=s.match(/(\d+(?:\.\d+)?)/);
  if(m)n=Math.max(1,parseFloat(m[1])||1);
  if(/lb\b|pound/.test(s)&&n>=2)n=Math.min(n,4);
  if(/gal|gallon/.test(s))n=Math.max(n,1.5);
  if(/box|bag|pack|case/.test(s)&&!m)n=1.5;
  if(/½|1\/2|0\.5/.test(s))n=0.75;
  return Math.min(Math.max(n,0.5),6);
}
function haveDurationDays(it){
  const aisle=String(it&&it.aisle||"").toLowerCase();
  const name=String(it&&it.n||it&&it.id||"").toLowerCase();
  const id=String(it&&it.id||"").toLowerCase();
  let base=HAVE_DUR.other;
  if(aisle==="produce"||/lettuce|tomato|onion|pepper|broccoli|fruit|banana|avocado|cilantro|lime|lemon|potato|asparagus|zucchini|salad|carrot|corn|cucumber|herb/.test(name))base=HAVE_DUR.produce;
  else if(aisle==="meat"||/beef|chicken|steak|pork|brat|sausage|bacon|turkey|sirloin|patty|rotisserie/.test(name))base=HAVE_DUR.meat;
  else if(aisle==="bread"||/bun|bagel|bread|tortilla|roll|toast/.test(name))base=HAVE_DUR.bread;
  else if(/milk|cream|half.?gal/.test(name)||id.includes("milk"))base=HAVE_DUR.milk;
  else if(/^eggs?\b|\beggs?\b/.test(name)||id==="eggs")base=HAVE_DUR.eggs;
  else if(aisle==="dairy")base=HAVE_DUR.dairy;
  else if(aisle==="snacks"||/chip|pretzel|cracker|popcorn/.test(name))base=HAVE_DUR.snacks;
  else if(/deli|lunch meat|pub sub|sushi|protein box/.test(name)||aisle==="grab")base=HAVE_DUR.deli;
  else if(/ketchup|mustard|mayo|sauce|salsa|dressing|hot sauce|bbq|soy|vinegar|relish|pickle/.test(name))base=HAVE_DUR.condiments;
  else if(/foil|wrap|parchment|bag|bags|lid|lids|seal/.test(name)||id.includes("lids")||id.includes("bags"))base=HAVE_DUR.foil;
  else if(/spice|season|pepper|salt|cumin|paprika|garlic powder|chili powder/.test(name)||id==="season")base=HAVE_DUR.spices;
  else if(/oil|spray|olive|canola/.test(name)||id==="spray")base=HAVE_DUR.oils;
  else if(aisle==="coffee"||/coffee|lavazza|capsule|oro/.test(name))base=HAVE_DUR.coffee;
  else if(aisle==="frozen")base=HAVE_DUR.frozen;
  else if(aisle==="pantry"||/rice|pasta|bean|cereal|flour|sugar|broth|stock|oat/.test(name))base=HAVE_DUR.bulk;
  const days=Math.min(180, Math.round(base*parseQtyFactor(it&&it.q)));
  return Math.max(1,days);
}
function haveUntilOf(id){
  const map=sweepHaveUntil(loadHaveUntil());
  return map[id]||0;
}
function itemHaveSuppressed(id){
  const until=haveUntilOf(id);

function markHaveIt(it){
  if(!it||!it.id)return;
  const days=haveDurationDays(it);
  const map=sweepHaveUntil(loadHaveUntil());
  map[it.id]=Date.now()+days*864e5;
  saveHaveUntil(map);
  return map[it.id];
}
function clearHaveIt(id){
  const map=sweepHaveUntil(loadHaveUntil());
  delete map[id];
  saveHaveUntil(map);
}
function countHiddenHave(){
  const map=sweepHaveUntil(loadHaveUntil());
  const now=Date.now();

function fmtHaveBack(until){
  if(!until||until<=Date.now())return "";
  const ms=until-Date.now();
  const days=Math.max(1,Math.ceil(ms/864e5));
  const d=new Date(until);
  const dateStr=MO3[d.getMonth()]+" "+d.getDate();
  if(days>=14){
    const w=Math.round(days/7);
    return "Back in "+w+" week"+(w===1?"":"s")+" · Back "+dateStr;
  }
  if(days===1)return "Back tomorrow · Back "+dateStr;
  return "Back in "+days+" days · Back "+dateStr;
}

function generateGroceryFromWeek(){
  if(!W)return;
  const beforeIds=new Set((W.items||[]).map(it=>it.id));
  // Prefer locked package when Week locked; else current week. Customs (getCamCustom) stay — not wiped by Generate.
  if(isWeekLocked()){
    const L=getWeekLock();
    if(L&&L.ov)W.ov=JSON.parse(JSON.stringify(L.ov));
    if(L&&L.daySides)W.daySides=JSON.parse(JSON.stringify(L.daySides));
    if(L&&L.base&&(!W.base||!W.base.length))W.base=JSON.parse(JSON.stringify(L.base));
  }
  recomputeList(); // Menu block only from week meals/swaps/sides. Stock produce + Munchies + customs + Have-it NEVER wiped.
  const after=(W.items||[]);
  const afterIds=new Set(after.map(it=>it.id));
  const kept=[...beforeIds].filter(id=>afterIds.has(id)).length;
  const added=after.filter(it=>!beforeIds.has(it.id)).length;
  const dropped=[...beforeIds].filter(id=>!afterIds.has(id)).length;
  if(typeof saveWeekSnap==="function")try{saveWeekSnap()}catch(_){}
  // If locked, refresh grocery snapshot inside lock package (local only)
  if(isWeekLocked()){
    try{
      const L=getWeekLock()||{};
      L.grocery=after.map(it=>({id:it.id,n:it.n,q:it.q,aisle:it.aisle,a:it.a,p:it.p,why:it.why||""}));
      L.groceryCount=L.grocery.length;
      localStorage.setItem(CM_WEEK_LOCK_KEY,JSON.stringify(L));
    }catch(_){}
  }
  renderWeek();
  const el=$("gpanel")||($("week")&&$("week").querySelector(".gpanel"));
  if(el)el.scrollIntoView({behavior:"smooth",block:"start"});
  toast("List rebuilt · "+kept+" kept, "+added+" added, "+dropped+" dropped");
}

    if(typeof dayActiveSides==="function"&&dayActiveSides(d).some(sn=>sn&&w.includes(sn.toLowerCase())))return true;
    if(d.meal&&w.includes((M(d.meal)||{}).name?.toLowerCase()||""))return true;
    if(d.bf&&w.includes("breakfast"))return dayIdx===filt;

  };

  const suppressed=it=>typeof itemHaveSuppressed==="function"&&itemHaveSuppressed(it.id)&&!getShowHiddenHave();
  const uniq=(items)=>{const seen=new Set();return items.filter(it=>{const id=it.id||it.n;if(seen.has(id))return false;seen.add(id);return true})};
  const section=(title,items)=>{
    const list=uniq(items.filter(it=>it&&!suppressed(it)&&match(it)&&(it.custom||it.standing||filt==null||days.some((d,i)=>showFor(it,i)))));

  let html="";

  const menuItems=[];
  Object.keys(byA||{}).forEach(k=>{(byA[k]||[]).forEach(it=>{
    if(it.standing||it.section==="stock_produce"||it.section==="munchies"||it.aisle==="stock_produce"||it.aisle==="munchies")return;
    if(it.custom&&(it.section==="menu_extras"||it.aisle==="menu_extras"||it.aisle==="other"||(it.why||"").toLowerCase().includes("custom")))return;

  })});
  /* Grab-and-go by store still under Menu */
  const grabGroups=typeof listByStore==="function"?listByStore().groups:{};
  Object.keys(grabGroups).sort().forEach(store=>{
    (grabGroups[store]||[]).forEach(it=>menuItems.push(it));
  });
  html+=section("Menu for this week", menuItems);

  const stock=typeof getStandingStock==="function"?getStandingStock():[];
  html+=section("Stock produce", stock);
  if(typeof stockProducePickerHTML==="function")html+=stockProducePickerHTML();

  const munch=typeof getStandingMunchies==="function"?getStandingMunchies():[];
  html+=section("Miscellaneous munchies", munch);
  if(typeof munchiesPickerHTML==="function")html+=munchiesPickerHTML();

  const customs=(typeof getCamCustom==="function"?getCamCustom():[]).filter(c=>!c.standing&&c.section!=="stock_produce"&&c.section!=="munchies"&&c.aisle!=="stock_produce"&&c.aisle!=="munchies");
  html+=section("Menu extras", customs);

  /* Remove custom from aisle folds handled above — also allow remove standing via data-rmcustom */
  return html||`<p class="gnote">No items yet. Generate list from this week, or Add item.</p>`;
}

const DAY_MEAL_OFFER_COUNT=7;
function dayMealPool(){
  const pool=typeof allMeals==="function"?allMeals():(MEALS||[]);
  return pool.filter(m=>m&&m.id&&m.id!=="veg"&&!m.bf&&rateOf(m.id)!==-1)
    .sort((a,b)=>(rateOf(b.id)===2)-(rateOf(a.id)===2)||((yes(b.id)?1:0)-(yes(a.id)?1:0)));
}
function shuffleDayMealOffers(dayIdx, keepId){
  const pool=dayMealPool();

  const push=m=>{if(m&&m.id&&!seen.has(m.id)){seen.add(m.id);out.push(m)}};
  if(keepId){

    if(cur)push(cur);
  }
  const rest=pool.filter(m=>!seen.has(m.id));
  for(let i=rest.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=rest[i];rest[i]=rest[j];rest[j]=t}
  for(const m of rest){if(out.length>=DAY_MEAL_OFFER_COUNT)break;push(m)}
  if(W){W.dayMealOffers=W.dayMealOffers||{};W.dayMealOffers[String(dayIdx)]=out.map(m=>m.id)}
  return out.slice(0,DAY_MEAL_OFFER_COUNT);

function compressImageFile(file,maxW,quality){
  maxW=maxW||1100;quality=quality==null?0.7:quality;
  return new Promise((resolve,reject)=>{
    const url=URL.createObjectURL(file);
    const img=new Image();
    img.onload=()=>{
      try{
        let w=img.naturalWidth||img.width,h=img.naturalHeight||img.height;
        if(!w||!h){URL.revokeObjectURL(url);resolve(null);return}
        if(w>maxW){h=Math.round(h*maxW/w);w=maxW}
        const c=document.createElement("canvas");c.width=w;c.height=h;
        const ctx=c.getContext("2d");ctx.drawImage(img,0,0,w,h);
        const out=c.toDataURL("image/jpeg",quality);
        URL.revokeObjectURL(url);resolve(out);
      }catch(err){URL.revokeObjectURL(url);reject(err)}
    };
    img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error("img"))};
    img.src=url;
  });
}

function b64url(bytes){let s="";bytes.forEach(b=>s+=String.fromCharCode(b));return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")}

async function compressPayload(obj){

    try{return "z"+LZString.compressToEncodedURIComponent(json)}catch(_){}
  }
  try{if(window.CompressionStream){const stream=new Blob([json]).stream().pipeThrough(new CompressionStream("gzip"));const buf=new Uint8Array(await new Response(stream).arrayBuffer());return "g"+b64url(buf)}}catch(_){}
  try{return "j"+btoa(unescape(encodeURIComponent(json))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")}catch(_){return "j"+encodeURIComponent(json)}
}
async function decompressPayload(raw){
  if(!raw)return null;
  try{
    if(raw.startsWith("z")&&typeof LZString!=="undefined"&&LZString.decompressFromEncodedURIComponent){
      return JSON.parse(LZString.decompressFromEncodedURIComponent(raw.slice(1)));
    }
    if(raw.startsWith("g")&&window.DecompressionStream){const bytes=fromB64url(raw.slice(1));const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));const text=await new Response(stream).text();return JSON.parse(text)}

}
